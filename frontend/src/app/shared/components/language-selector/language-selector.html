<div class="language-selector">
  <button
    #buttonEl
    type="button"
    class="trigger"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
    (keydown)="onButtonKeydown($event)"
  >
    <span class="trigger-label">{{ currentOption().label }}</span>
    <svg class="trigger-caret" viewBox="0 0 12 8" aria-hidden="true" width="10" height="7">
      <path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor" stroke-width="1.6" />
    </svg>
  </button>

  @if (isOpen()) {
    <ul
      #listEl
      class="options"
      role="listbox"
      [attr.aria-activedescendant]="'lang-option-' + activeIndex()"
      tabindex="-1"
    >
      @for (option of options; track option.code; let i = $index) {
        <li
          #optionEl
          [id]="'lang-option-' + i"
          class="option"
          role="option"
          [class.is-selected]="option.code === currentOption().code"
          [class.is-disabled]="!option.enabled"
          [attr.aria-selected]="option.code === currentOption().code"
          [attr.aria-disabled]="!option.enabled"
          tabindex="-1"
          (click)="select(option)"
          (keydown)="onListKeydown($event)"
        >
          <span class="option-label">{{ option.label }}</span>
          @if (!option.enabled) {
            <span class="option-badge">Coming soon</span>
          }
        </li>
      }
    </ul>
  }
</div>
