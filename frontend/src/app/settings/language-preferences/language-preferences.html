<fieldset class="card">
  <legend>Language preference</legend>
  <p class="hint">
    Auto-detect picks up the language from what you type; a manual pin always wins over it.
  </p>

  <ul class="list" role="radiogroup" aria-label="Preferred language">
    @for (option of options; track option.code) {
      <li>
        <button
          type="button"
          class="option"
          [class.is-auto]="option.code === 'auto'"
          role="radio"
          [attr.aria-checked]="effectiveSelection() === option.code"
          [disabled]="!option.enabled"
          [attr.data-selected]="effectiveSelection() === option.code"
          (click)="select(option.code)"
        >
          <span [attr.lang]="option.code === 'hi' ? 'hi' : null">{{ option.label }}</span>
          <span class="english">{{ option.englishName }}</span>
          @if (!option.enabled) {
            <span class="soon">Coming soon</span>
          }
        </button>
      </li>
      @if (option.code === 'auto') {
        <li class="list-divider" role="separator" aria-hidden="true"></li>
      }
    }
  </ul>
</fieldset>
