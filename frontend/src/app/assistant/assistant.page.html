<section class="page">
  <app-conversation-view class="conversation" />

  @if (hasError()) {
    <div class="error-banner" role="alert">
      Something went wrong. Tap the mic or send your message again.
    </div>
  }

  <footer class="console">
    <div class="console-primary">
      <app-mic-button />
      <app-voice-state-indicator />
    </div>

    <div class="console-secondary">
      <app-language-selector />
      <app-text-input-bar class="text-input" />
    </div>

    @if (!isProduction) {
      <button type="button" class="dev-affordance" (click)="onSimulateError()">
        Simulate error (dev)
      </button>
    }
  </footer>
</section>
