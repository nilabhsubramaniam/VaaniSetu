<section class="how-it-works">
  <h2 class="how-heading">{{ heading() }}</h2>

  <ol class="steps">
    @for (step of steps(); track step.title; let i = $index) {
      <li class="step">
        <span class="step-icon" aria-hidden="true">
          @switch (i) {
            @case (0) {
              <svg viewBox="0 0 40 40" width="32" height="32">
                <rect
                  x="15"
                  y="6"
                  width="10"
                  height="18"
                  rx="5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <path
                  d="M10 20a10 10 0 0 0 20 0"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <line x1="20" y1="30" x2="20" y2="35" stroke="currentColor" stroke-width="2" />
              </svg>
            }
            @case (1) {
              <svg viewBox="0 0 40 40" width="32" height="32">
                <path
                  d="M6 14h14M6 14l5-5M6 14l5 5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <path
                  d="M34 26H20M34 26l-5-5M34 26l-5 5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            }
            @default {
              <svg viewBox="0 0 40 40" width="32" height="32">
                <circle cx="12" cy="20" r="6" fill="none" stroke="currentColor" stroke-width="2" />
                <circle cx="28" cy="20" r="6" fill="none" stroke="currentColor" stroke-width="2" />
                <line x1="18" y1="20" x2="22" y2="20" stroke="currentColor" stroke-width="2" />
              </svg>
            }
          }
        </span>
        <span class="step-index">{{ i + 1 }}</span>
        <h3 class="step-title">{{ step.title }}</h3>
        <p class="step-description">{{ step.description }}</p>
      </li>
    }
  </ol>
</section>
