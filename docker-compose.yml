# Phase 2/3/4/5: postgres + backend + ai-services (llm + asr + tts capabilities).
# Model weights are never baked into the ai-services image
# (docs/ARCHITECTURE.md §6) — run `ai-services/scripts/download_models.py`
# on the host first; the ./models bind mount below is how the container
# sees them.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vaanisetu
      POSTGRES_PASSWORD: vaanisetu
      POSTGRES_DB: vaanisetu
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaanisetu"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-services:
    build:
      context: ./ai-services
    ports:
      - "8090:8090"
    volumes:
      # Read-only: this container only ever reads weights, never writes
      # them (docs/ARCHITECTURE.md §6 — downloaded on the host, not
      # inside the container). One mount covers all three capabilities'
      # subdirectories.
      - ./models:/app/models:ro
    environment:
      VAANISETU_LLM_PORT: "8090"
      VAANISETU_LLM_MODEL_STORE: "/app/models/llm"
      VAANISETU_ASR_MODEL_STORE: "/app/models/asr"
      VAANISETU_TTS_MODEL_STORE: "/app/models/tts"
    healthcheck:
      # /healthz always returns HTTP 200 even before models finish
      # loading (app/main.py) — it reports readiness in the JSON body
      # ("ready": true/false), so a plain HTTP-status check isn't enough;
      # this parses the body with the interpreter already in the image
      # (python:3.12-slim), no extra tool needed. Generous timing: three
      # models (llm+asr+tts, Phase 4/5) can take real time to load.
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import json,sys,urllib.request; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8090/healthz')).get('ready') else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      VAANISETU_PORT: "8080"
      VAANISETU_DATABASE_URL: "postgres://vaanisetu:vaanisetu@postgres:5432/vaanisetu?sslmode=disable"
      VAANISETU_LOG_LEVEL: "info"
      # Default already matches Angular's dev server; only needs overriding
      # for a differently-configured frontend origin.
      VAANISETU_ALLOWED_ORIGIN: "http://localhost:4200"
      # Set, as of Milestone 2b/3b/4b: the ai-services container above now
      # implements all three contracts (proto/llm.openapi.yaml,
      # proto/asr.openapi.yaml, proto/tts.openapi.yaml), so the backend
      # uses HTTPLLMClient/HTTPASRClient/HTTPTTSClient instead of the fake
      # clients.
      VAANISETU_LLM_SERVICE_URL: "http://ai-services:8090"
      VAANISETU_ASR_SERVICE_URL: "http://ai-services:8090"
      VAANISETU_TTS_SERVICE_URL: "http://ai-services:8090"
    depends_on:
      postgres:
        condition: service_healthy
      ai-services:
        # Was service_started (Phase 4): backend could come up and start
        # serving traffic before ai-services finished loading its models,
        # so an early request would hit a real, if temporary,
        # llm/asr/tts_unavailable — service_healthy (Phase 5) waits for
        # the healthcheck above to report actually ready first.
        condition: service_healthy

volumes:
  postgres-data:
