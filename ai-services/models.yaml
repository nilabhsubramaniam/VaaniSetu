# Model registry, one top-level key per capability (docs/ARCHITECTURE.md
# §3.6). Application code (app.main / app.registry) references a
# capability by name only — never a model name — so changing `selected`
# is a config change, not a code change (ADR-006).
#
# Weights are not committed (docs/DEVELOPMENT.md §15) — download them with
# `ai-services/scripts/download_models.py` into the git-ignored
# `models/<capability>/` directory before starting this service.

# `selected` reflects the outcome of the Milestone 2b benchmark recorded
# in docs/DECISIONS.md ADR-016. All three `candidates` remain listed (not
# deleted) so the benchmark stays reproducible and any of them can be
# re-selected by editing this one line. `filename` names one GGUF file
# under `models/llm/`.
llm:
  selected: llama-3.2-3b-instruct
  candidates:
    qwen2.5-3b-instruct:
      engine: llama_cpp
      repo_id: Qwen/Qwen2.5-3B-Instruct-GGUF
      filename: qwen2.5-3b-instruct-q4_k_m.gguf
      context_length: 4096
      max_tokens: 512
      license: Apache-2.0
    llama-3.2-3b-instruct:
      engine: llama_cpp
      repo_id: bartowski/Llama-3.2-3B-Instruct-GGUF
      filename: Llama-3.2-3B-Instruct-Q4_K_M.gguf
      context_length: 4096
      max_tokens: 512
      license: Llama 3.2 Community License
    gemma-2-2b-it:
      engine: llama_cpp
      repo_id: bartowski/gemma-2-2b-it-GGUF
      filename: gemma-2-2b-it-Q4_K_M.gguf
      context_length: 4096
      max_tokens: 512
      license: Gemma Terms of Use

# `selected` reflects the outcome of the Milestone 3b benchmark recorded
# in docs/DECISIONS.md ADR-018. Each candidate is a full CTranslate2 repo
# snapshot (no single `filename` — see app/registry.py), downloaded as a
# directory under `models/asr/<key>/`.
asr:
  selected: faster-whisper-large-v3-turbo
  candidates:
    faster-whisper-small:
      engine: faster_whisper
      repo_id: Systran/faster-whisper-small
      compute_type: int8
      device: auto
      license: MIT
    faster-whisper-medium:
      engine: faster_whisper
      repo_id: Systran/faster-whisper-medium
      compute_type: int8
      device: auto
      license: MIT
    faster-whisper-large-v3-turbo:
      engine: faster_whisper
      repo_id: deepdml/faster-whisper-large-v3-turbo-ct2
      compute_type: int8
      device: auto
      license: MIT

# `selected` reflects the outcome of the Milestone 4b benchmark recorded
# in docs/DECISIONS.md ADR-021, then revised by ADR-022 to a female-voice
# fine-tune of the same architecture (facebook/mms-tts-hin's single voice
# is male — a real, user-reported gap ADR-021 didn't evaluate for). `voices`
# maps a LanguageCode to an engine-specific voice selector
# (docs/ARCHITECTURE.md §3.6's "per-language voice configuration") — a
# natural-language description for parler_tts, a built-in speaker name for
# xtts; mms_vits is a single voice per checkpoint and needs none.
#
# `indic-parler-tts` could NOT be benchmarked this round — its Hugging
# Face repo is gated and access was denied for the account used (see
# ADR-021). It stays listed, unselected, as a real candidate worth
# re-benchmarking once access is granted, since it is the only
# Apache-2.0-licensed candidate here: every other candidate, including
# both `mms_vits` checkpoints, is non-commercial-licensed. See
# ADR-021/ADR-022 for the full reasoning and measured evidence.
tts:
  selected: mms-tts-hin-ft-female
  candidates:
    mms-tts-hin:
      engine: mms_vits
      repo_id: facebook/mms-tts-hin
      license: CC-BY-NC-4.0
    mms-tts-hin-ft-female:
      engine: mms_vits
      repo_id: Anjan9320/fb-mms-tts-hin-ft-female
      license: CC-BY-NC-4.0
    indic-parler-tts:
      engine: parler_tts
      repo_id: ai4bharat/indic-parler-tts
      license: Apache-2.0
      voices:
        hi: "A clear Indian female voice speaks in Hindi at a moderate pace with high quality, close-sounding audio."
        hinglish: "A clear Indian female voice speaks at a moderate pace with high quality, close-sounding audio."
        en: "A clear Indian-accented female voice speaks in English at a moderate pace with high quality, close-sounding audio."
    xtts-v2:
      engine: xtts
      repo_id: coqui/XTTS-v2
      license: CPML
      voices:
        hi: "Ana Florence"
        hinglish: "Ana Florence"
        en: "Andrew Chipper"
