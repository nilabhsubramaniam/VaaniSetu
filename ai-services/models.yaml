        hi: "Ana Florence"
        hinglish: "Ana Florence"
        en: "Andrew Chipper"

# `selected` reflects the outcome of the Milestone 6b benchmark recorded
# in docs/DECISIONS.md ADR-027 — a real, if counter-intuitive, result:
# the general-purpose `fasttext-lid176` baseline measured *higher* overall
# accuracy than the Indic-specific `indiclid` candidate on this project's
# small fixture set, and neither correctly classified either Hinglish
# fixture. `indiclid` stays listed (not deleted) as a real candidate for
# re-benchmarking against a larger fixture set later, per ADR-027.
#
# `indiclid` downloads three files directly from GitHub Releases (not a HF
# repo snapshot — `download_urls` keys ftn/ftr/bert, extracted under
# `models/langid/indiclid/<part>/` by download_models.py), plus a fourth,
# separate HF snapshot for its BERT fallback stage's tokenizer
# (`bert_tokenizer`, downloaded like any other HF-hosted asset). Real
# sizes, checked against the GitHub Releases API: ftn 161MB, ftr 218MB,
# bert 924MB.
#
# `fasttext-lid176` downloads a single file directly from
# dl.fbaipublicfiles.com (`download_url`) — the original CC-BY-SA-3.0
# distribution, not the non-commercial `facebook/fasttext-language-identification`
# Hugging Face repackaging (verified CC-BY-NC-4.0, not used).
langid:
  selected: fasttext-lid176
  candidates:
    indiclid:
      engine: indiclid
      repo_id: ai4bharat/IndicLID
      license: MIT
      download_urls:
        ftn: https://github.com/AI4Bharat/IndicLID/releases/download/v1.0/indiclid-ftn.zip
        ftr: https://github.com/AI4Bharat/IndicLID/releases/download/v1.0/indiclid-ftr.zip
        bert: https://github.com/AI4Bharat/IndicLID/releases/download/v1.0/indiclid-bert.zip
      bert_tokenizer: ai4bharat/IndicBERTv2-MLM-only
    fasttext-lid176:
      engine: fasttext_lid
      repo_id: facebook/fastText (lid.176)
      license: CC-BY-SA-3.0
      download_url: https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.bin
      filename: lid.176.bin
