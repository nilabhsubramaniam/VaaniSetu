# Model registry, one top-level key per capability (docs/ARCHITECTURE.md
# §3.6). Application code (app.main / app.registry) references a
# capability by name only — never a model name — so changing `selected`
# is a config change, not a code change (ADR-006).
#
# Weights are not committed (docs/DEVELOPMENT.md §15) — download them with
# `ai-services/scripts/download_models.py` into the git-ignored
# `models/<capability>/` directory before starting this service.

# `selected` reflects the outcome of the Milestone 2b benchmark recorded
# in docs/DECISIONS.md ADR-016. All three `candidates` remain listed (not
# deleted) so the benchmark stays reproducible and any of them can be
# re-selected by editing this one line. `filename` names one GGUF file
# under `models/llm/`.
llm:
  selected: llama-3.2-3b-instruct
  candidates:
    qwen2.5-3b-instruct:
      engine: llama_cpp
      repo_id: Qwen/Qwen2.5-3B-Instruct-GGUF
      filename: qwen2.5-3b-instruct-q4_k_m.gguf
      context_length: 4096
      max_tokens: 512
      license: Apache-2.0
    llama-3.2-3b-instruct:
      engine: llama_cpp
      repo_id: bartowski/Llama-3.2-3B-Instruct-GGUF
      filename: Llama-3.2-3B-Instruct-Q4_K_M.gguf
      context_length: 4096
      max_tokens: 512
      license: Llama 3.2 Community License
    gemma-2-2b-it:
      engine: llama_cpp
      repo_id: bartowski/gemma-2-2b-it-GGUF
      filename: gemma-2-2b-it-Q4_K_M.gguf
      context_length: 4096
      max_tokens: 512
      license: Gemma Terms of Use

# `selected` reflects the outcome of the Milestone 3b benchmark recorded
# in docs/DECISIONS.md ADR-018. Each candidate is a full CTranslate2 repo
# snapshot (no single `filename` — see app/registry.py), downloaded as a
# directory under `models/asr/<key>/`.
asr:
  selected: faster-whisper-large-v3-turbo
  candidates:
    faster-whisper-small:
      engine: faster_whisper
      repo_id: Systran/faster-whisper-small
      compute_type: int8
      device: auto
      license: MIT
    faster-whisper-medium:
      engine: faster_whisper
      repo_id: Systran/faster-whisper-medium
      compute_type: int8
      device: auto
      license: MIT
    faster-whisper-large-v3-turbo:
      engine: faster_whisper
      repo_id: deepdml/faster-whisper-large-v3-turbo-ct2
      compute_type: int8
      device: auto
      license: MIT

# `tts` is the one capability where `selected` is a *map* — as of
# Milestone 6c, a two-level `{language: {voice: key}}` map, not the flat
# `{voice: key}` map ADR-023 introduced. Both a female and a male voice
# are real, simultaneously-loaded choices per language (app/main.py loads
# one engine per (language, voice) pair at startup, de-duplicating by
# candidate key so `hi`/`hinglish` sharing the same Hindi checkpoints
# don't load them twice), picked per-request by the frontend's voice
# setting and the turn's language. `mms-tts-hin-ft-female`/`mms-tts-hin`
# reflect ADR-021's benchmark and ADR-022's female-voice finding
# (facebook/mms-tts-hin's single voice is male — a real, user-reported gap
# ADR-021 didn't evaluate for); `hinglish` reuses the same two Hindi
# checkpoints (there is no separate Hinglish TTS model — Latin-script
# Hinglish text still fails inside them, ADR-021's already-documented
# gap, now surfaced as an engine-internal failure rather than a missing-
# language one, since `hinglish` IS configured, just not truly
# supported). `ml` is Milestone 6c's new language: only one real
# Malayalam voice was found (see ADR-028), so both `female` and `male`
# point at the same checkpoint — a real, honestly-recorded asymmetry with
# Hindi, not an oversight. `mai` (Milestone 6f, Maithili) has the same
# one-voice asymmetry for the same reason: `facebook/mms-tts-mai` is the
# only Maithili TTS checkpoint found. `bn`/`ta`/`te`/`kn` (Milestone 6h),
# `gu`/`mr`/`pa` (Milestone 6i), and `or` (Milestone 6j) share the same
# one-voice-per-language asymmetry — `facebook/mms-tts-
# {ben,tam,tel,kan,guj,mar,pan,ory}` are each the only checkpoint found
# for their language, same as `ml`/`mai`.
# `voices` maps a LanguageCode to an
# engine-specific voice selector (docs/ARCHITECTURE.md §3.6's
# "per-language voice configuration") — a natural-language description
# for parler_tts, a built-in speaker name for xtts; mms_vits is a single
# voice per checkpoint and needs none (its "voice choice" is which
# checkpoint, not a per-language config on one).
#
# `indic-parler-tts` could NOT be benchmarked this round — its Hugging
# Face repo is gated and access was denied for the account used (see
# ADR-021). It stays listed, unselected, as a real candidate worth
# re-benchmarking once access is granted, since it is the only
# Apache-2.0-licensed candidate here: every other candidate, including
# both `mms_vits` checkpoints, is non-commercial-licensed. See
# ADR-021/ADR-022/ADR-023/ADR-028 for the full reasoning and measured
# evidence.
tts:
  selected:
    hi:
      female: mms-tts-hin-ft-female
      male: mms-tts-hin
    hinglish:
      female: mms-tts-hin-ft-female
      male: mms-tts-hin
    ml:
      female: mms-tts-mal
      male: mms-tts-mal
    mai:
      female: mms-tts-mai
      male: mms-tts-mai
    bn:
      female: mms-tts-ben
      male: mms-tts-ben
    ta:
      female: mms-tts-tam
      male: mms-tts-tam
    te:
      female: mms-tts-tel
      male: mms-tts-tel
    kn:
      female: mms-tts-kan
      male: mms-tts-kan
    gu:
      female: mms-tts-guj
      male: mms-tts-guj
    mr:
      female: mms-tts-mar
      male: mms-tts-mar
    pa:
      female: mms-tts-pan
      male: mms-tts-pan
    or:
      female: mms-tts-ory
      male: mms-tts-ory
  candidates:
    mms-tts-hin:
      engine: mms_vits
      repo_id: facebook/mms-tts-hin
      license: CC-BY-NC-4.0
    mms-tts-hin-ft-female:
      engine: mms_vits
      repo_id: Anjan9320/fb-mms-tts-hin-ft-female
      license: CC-BY-NC-4.0
    mms-tts-mal:
      engine: mms_vits
      repo_id: facebook/mms-tts-mal
      license: CC-BY-NC-4.0
    mms-tts-mai:
      engine: mms_vits
      repo_id: facebook/mms-tts-mai
      license: CC-BY-NC-4.0
    mms-tts-ben:
      engine: mms_vits
      repo_id: facebook/mms-tts-ben
      license: CC-BY-NC-4.0
    mms-tts-tam:
      engine: mms_vits
      repo_id: facebook/mms-tts-tam
      license: CC-BY-NC-4.0
    mms-tts-tel:
      engine: mms_vits
      repo_id: facebook/mms-tts-tel
      license: CC-BY-NC-4.0
    mms-tts-kan:
      engine: mms_vits
      repo_id: facebook/mms-tts-kan
      license: CC-BY-NC-4.0
    mms-tts-guj:
      engine: mms_vits
      repo_id: facebook/mms-tts-guj
      license: CC-BY-NC-4.0
    mms-tts-mar:
      engine: mms_vits
      repo_id: facebook/mms-tts-mar
      license: CC-BY-NC-4.0
    mms-tts-pan:
      engine: mms_vits
      repo_id: facebook/mms-tts-pan
      license: CC-BY-NC-4.0
    mms-tts-ory:
      engine: mms_vits
      repo_id: facebook/mms-tts-ory
      license: CC-BY-NC-4.0
    indic-parler-tts:
      engine: parler_tts
      repo_id: ai4bharat/indic-parler-tts
      license: Apache-2.0
      voices:
        hi: "A clear Indian female voice speaks in Hindi at a moderate pace with high quality, close-sounding audio."
        hinglish: "A clear Indian female voice speaks at a moderate pace with high quality, close-sounding audio."
        en: "A clear Indian-accented female voice speaks in English at a moderate pace with high quality, close-sounding audio."
    xtts-v2:
      engine: xtts
      repo_id: coqui/XTTS-v2
      license: CPML
