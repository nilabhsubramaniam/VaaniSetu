[project]
name = "vaanisetu-ai-services"
version = "0.1.0"
description = "VaaniSetu's Python AI service — the `llm` (Milestone 2b), `asr` (Milestone 3b), and `tts` (Milestone 4b) capabilities, hosted in one FastAPI app per docs/DECISIONS.md ADR-017."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "llama-cpp-python>=0.3,<1",
    "pyyaml>=6.0,<7",
    "faster-whisper>=1.2,<2",
    "numpy>=1.26,<3",
    # All three Milestone 4b `tts` candidates share this torch/transformers
    # base — one heavy dependency, not three.
    "torch>=2.4,<3",
    "transformers>=4.45,<5",
    "parler-tts @ git+https://github.com/huggingface/parler-tts.git",
    "coqui-tts>=0.24,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
    # Only used by scripts/download_models.py and scripts/benchmark.py —
    # never imported by the running service (app/), so it stays a dev
    # dependency rather than a runtime one.
    "huggingface-hub>=0.26,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)` — a
# call in a default argument that ruff's B008 would otherwise flag. This
# is the exact fix ruff's own docs recommend for FastAPI projects, not a
# blanket suppression.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
# parler-tts (the ai4bharat/indic-parler-tts candidate's package) has no
# PyPI release yet — the project itself documents installing straight from
# its GitHub repo (see app/engines/tts/parler_engine.py's docstring
# context). This is a direct URL dependency, not a version constraint
# relaxation.
allow-direct-references = true
