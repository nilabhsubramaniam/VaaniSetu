[project]
name = "vaanisetu-ai-services"
version = "0.1.0"
description = "VaaniSetu's Python AI service — the `llm` (Milestone 2b) and `asr` (Milestone 3b) capabilities, hosted in one FastAPI app per docs/DECISIONS.md ADR-017."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "llama-cpp-python>=0.3,<1",
    "pyyaml>=6.0,<7",
    "faster-whisper>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
    # Only used by scripts/download_models.py and scripts/benchmark.py —
    # never imported by the running service (app/), so it stays a dev
    # dependency rather than a runtime one.
    "huggingface-hub>=0.26,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)` — a
# call in a default argument that ruff's B008 would otherwise flag. This
# is the exact fix ruff's own docs recommend for FastAPI projects, not a
# blanket suppression.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
