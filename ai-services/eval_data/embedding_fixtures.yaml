# Phase 7 Milestone 7b's embedding-candidate benchmark fixtures
# (docs/DECISIONS.md, ADR pending). Retrieval doesn't exist yet (that's a
# later milestone) — this manifest lets scripts/benchmark_embedding.py
# measure retrieval quality directly with cosine similarity, the same
# kind of standalone, phase-scoped proxy metric scripts/benchmark_tts.py's
# "proxy WER" already established.
#
# Composed directly, not corpus-sourced — same "written directly, not
# reviewed by a native speaker" caveat every other non-Hindi-corpus
# fixture file in this project already states plainly.
#
# `passages` are the documents being searched; `queries` each name the
# `passage_id` they should rank highest. `cross_lingual: true` marks a
# query written in a different language than its matching passage — this
# project's own stated goal (docs/PROJECT_GOAL.md: "cross-lingual
# grounding") is measured as its own, separate accuracy figure, not
# averaged into the overall number, so a candidate that's merely good at
# same-language matching can't hide a real cross-lingual weakness.
passages:
  - id: p1
    language: hi
    text: "भारत की राजधानी दिल्ली है। यह एक बहुत पुराना और ऐतिहासिक शहर है।"
  - id: p2
    language: en
    text: "The Eiffel Tower is located in Paris, France. It was completed in 1889 and is 330 meters tall."
  - id: p3
    language: hinglish
    text: "Mera favorite food pizza hai, especially jab usme extra cheese ho aur thoda spicy ho."
  - id: p4
    language: hi
    text: "मानसून का मौसम जून से सितंबर तक रहता है और इस दौरान भारी बारिश होती है।"
  - id: p5
    language: en
    text: "Python is a popular programming language known for its readability and large ecosystem of libraries."

queries:
  - id: q1
    language: hi
    text: "भारत की राजधानी कौन सी है?"
    passage_id: p1
    cross_lingual: false
  - id: q2
    language: en
    text: "What is the capital city of India?"
    passage_id: p1
    cross_lingual: true
  - id: q3
    language: en
    text: "Where is the Eiffel Tower situated?"
    passage_id: p2
    cross_lingual: false
  - id: q4
    language: hi
    text: "एफिल टावर कहाँ स्थित है?"
    passage_id: p2
    cross_lingual: true
  - id: q5
    language: hinglish
    text: "Tumhara pasandida khana kya hai?"
    passage_id: p3
    cross_lingual: false
  - id: q6
    language: hi
    text: "मानसून का मौसम कब शुरू होता है?"
    passage_id: p4
    cross_lingual: false
  - id: q7
    language: en
    text: "When does the monsoon season begin in India?"
    passage_id: p4
    cross_lingual: true
  - id: q8
    language: en
    text: "What programming language is known for readability?"
    passage_id: p5
    cross_lingual: false
