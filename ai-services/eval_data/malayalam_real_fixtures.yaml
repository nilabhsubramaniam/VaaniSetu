# Phase 6 Milestone 6d's real-audio Malayalam ASR diagnostic (see
# docs/DECISIONS.md ADR-029). Every other fixture manifest in this
# project (asr_fixtures.yaml) is synthetic, single-speaker, TTS-generated
# audio — a real, stated limitation those files call out themselves. This
# one is different: real, human-recorded speech, five short sentences
# hand-picked (natural, non-navigation utterances, one per speaker) from
# Google's IndicTTS Malayalam corpus.
#
# Source: Google's IndicTTS Malayalam corpus, OpenSLR resource 63
# (https://www.openslr.org/63/), CC-BY-SA-4.0. Cite as:
#   He, Chu, Kjartansson, Rivera, Katanova, Gutkin, Demirsahin, Johny,
#   Jansche, Sarin, Pipatsrisawat. "Open-source Multi-speaker Speech
#   Corpora for Building Gujarati, Kannada, Malayalam, Marathi, Tamil and
#   Telugu Speech Synthesis Systems." LREC 2020.
#
# The audio itself is never committed (a dataset, AGENTS.md §12) — this
# manifest (fixture id + real transcript, both freely reusable under the
# corpus's CC-BY-SA-4.0 license) is what's committed.
# scripts/download_malayalam_real_fixtures.py downloads the corpus
# (~710MB, one time) and extracts only these five clips into the
# git-ignored eval_data/audio_malayalam_real/.
fixtures:
  - id: mlf_02321_00657140418
    language: ml
    text: "നല്ല ഒരു ഉപകരണം ആണ് അത്"
  - id: mlf_06469_00325832880
    language: ml
    text: "ഞാൻ ആ പേജിൽ പോയി നോക്കി"
  - id: mlf_03228_01626077260
    language: ml
    text: "അതിൽ ഒരു കാരണം ഞാൻ പറയാം"
  - id: mlf_03435_02144049700
    language: ml
    text: "ലേഖനം നല്ല ഒരു ആശയം ആണ്‌"
  - id: mlf_03228_00255406825
    language: ml
    text: "അവർ ഇവിടെ ഒരു കോട്ട പണിതു"
