# Milestone 3b's lightweight, phase-scoped ASR benchmark fixture set
# (docs/ROADMAP.md Phase 3's "small fixed Hindi + Hinglish audio set" —
# not Phase 9's future rigorous, human-recorded evaluation corpus).
#
# This manifest (ground truth text + language + which system TTS voice
# reads it) is committed; the actual audio is NOT — it's synthesized on
# demand by scripts/generate_audio_fixtures.py into the git-ignored
# eval_data/audio/ directory. This sidesteps two real constraints at
# once: no real human-recorded Hindi/Hinglish speech corpus exists in
# this repository yet (Phase 8's dataset pipeline is what would build
# one properly), and building a text-to-speech capability to generate
# this audio is explicitly Phase 4, out of scope here — using the
# operating system's own pre-existing `say` command as a one-time dev
# tool to bootstrap test fixtures is not the same as building or shipping
# a TTS capability.
#
# Known limitation, stated plainly: this is synthetic, single-speaker
# voice, not real human speech — WER measured against it is optimistic
# and does not substitute for real recordings. Regenerating requires
# macOS (the `say` command); this is a real portability limitation of
# this specific benchmark run, not of the ASR service itself, which
# accepts any recorded audio regardless of how it was produced.
#
# Milestone 6c added the four `ml-*` (Malayalam) fixtures below with no
# `voice` field, deliberately: macOS has no Malayalam `say` voice at all
# (checked directly — Hindi/Bengali/Tamil/Telugu/Kannada have one, this
# language doesn't), so scripts/generate_audio_fixtures.py cannot produce
# real audio for them the way it does every other language here. They
# exist only for scripts/benchmark_tts.py's synthesize-then-transcribe
# proxy measurement (the mms-tts-mal candidate synthesizes the text,
# faster-whisper transcribes it back, WER is computed against the
# original) — the only Malayalam ASR+TTS evidence available in this
# environment, and a real, stated limitation (docs/DECISIONS.md ADR-028),
# not something hidden.
#
# Milestone 6f added the four `mai-*` (Maithili) fixtures below, same
# no-`voice`-field situation as Malayalam (no macOS Maithili `say` voice
# either). Note on provenance, stated plainly rather than overclaimed: a
# real, licensed parallel corpus (FLORES-200's `mai_Deva` split, Meta,
# CC-BY-SA-4.0) was the intended source, but every hosting mirror checked
# (`openlanguagedata/flores_plus`, `facebook/flores`) is gated behind
# Hugging Face authentication not available in this environment. These
# four sentences were composed directly instead, mirroring the existing
# Hindi/Malayalam fixtures' own themes and using well-documented Maithili
# grammar (the `अछि`/`छी` copulas, the `टा` classifier, `अहाँ`/`हमरा`
# pronouns, the `क` genitive) — the same "written directly, not sourced
# from a certified corpus" basis the pre-existing Hindi/Malayalam fixtures
# already have, made explicit here rather than implied. `benchmark_tts.py`
# and `benchmark_langid.py` measure whether the already-selected models
# can produce/detect genuine Maithili at all; a native-speaker review of
# these exact four sentences before treating any result as final would be
# a reasonable next step, not assumed done here.
fixtures:
  - id: hi-weather
    language: hi
    text: "आज मौसम कैसा है?"
    voice: Lekha
  - id: hi-capital
    language: hi
    text: "भारत की राजधानी क्या है?"
    voice: Lekha
  - id: hi-story
    language: hi
    text: "मुझे एक छोटी कहानी सुनाओ"
    voice: Lekha
  - id: hi-greeting
    language: hi
    text: "नमस्ते, आप कैसे हैं?"
    voice: Lekha
  - id: hinglish-weather
    language: hinglish
    text: "kal ka weather kaisa rahega, bata sakte ho"
    voice: Tara
  - id: hinglish-joke
    language: hinglish
    text: "mujhe ek chhoti si joke sunao"
    voice: Rishi
  - id: en-learn-hindi
    language: en
    text: "What's a good way to learn Hindi quickly?"
    voice: Samantha
  - id: en-schedule
    language: en
    text: "What's on my schedule today?"
    voice: Aman
  - id: ml-weather
    language: ml
    text: "ഇന്ന് കാലാവസ്ഥ എങ്ങനെയുണ്ട്?"
  - id: ml-capital
    language: ml
    text: "ഇന്ത്യയുടെ തലസ്ഥാനം ഏതാണ്?"
  - id: ml-story
    language: ml
    text: "എനിക്ക് ഒരു ചെറിയ കഥ പറയൂ"
  - id: ml-greeting
    language: ml
    text: "നമസ്കാരം, സുഖമാണോ?"
  - id: mai-weather
    language: mai
    text: "आइ मौसम कहन अछि?"
  - id: mai-capital
    language: mai
    text: "भारतक राजधानी की अछि?"
  - id: mai-story
    language: mai
    text: "हमरा एकटा छोट कथा सुनाउ"
  - id: mai-greeting
    language: mai
    text: "प्रणाम, अहाँ कोना छी?"
