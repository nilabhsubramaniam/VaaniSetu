version: "2"

# Minimal, high-value linter set (docs/DECISIONS.md: "avoid unnecessary
# dependencies" applies to tooling surface too, not just libraries).
# `standard` + `default` is golangci-lint v2's own recommended baseline
# (govet, staticcheck, errcheck, unused, ineffassign, and a few more) —
# nothing exotic added on top for Phase 2.
linters:
  default: standard
  enable:
    - errcheck
    - staticcheck
    - unused
    - ineffassign

formatters:
  enable:
    - gofmt
    - goimports

issues:
  exclude-dirs:
    - internal/db # sqlc-generated; not ours to fix lint issues in
