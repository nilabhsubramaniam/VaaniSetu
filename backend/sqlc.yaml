version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          # sqlc has no built-in knowledge of pgvector's `vector` type
          # (Phase 7 Milestone 7c) — map it to pgvector-go's own type,
          # the same driver internal/db/pool.go registers on the pool.
          # The module's last path segment ("pgvector-go") isn't its
          # actual package name ("pgvector"), so the plain
          # "module/path.Type" string form produces an invalid import
          # alias — spelled out explicitly instead.
          - db_type: "vector"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "Vector"
