openapi: 3.0.3
info:
  title: VaaniSetu Backend — Speech API
  version: "1.1.0"
  description: >
    Phase 3 (Speech-to-Text) transcription and Phase 4 (Text-to-Speech)
    synthesis surfaces. Hand-maintained, same convention as
    docs/openapi/chat.yaml — see that file's description for why. Neither
    endpoint has a persistence side effect: transcribe only returns text,
    synthesize only returns audio. The caller feeds a transcript into
    POST /chat separately (docs/openapi/chat.yaml), reusing that
    endpoint's existing turn-persistence path unchanged
    (docs/DECISIONS.md ADR-017/ADR-020). CORS: same policy as the chat
    API — see docs/openapi/chat.yaml.
servers:
  - url: http://localhost:8080/api/v1

paths:
  /speech/transcribe:
    post:
      summary: >
        Transcribe a recorded utterance. Audio is never persisted or
        retained — discarded once this call returns
        (docs/PROJECT_GOAL.md).
      parameters:
        - name: language
          in: query
          required: true
          schema:
            $ref: "./chat.yaml#/components/schemas/LanguageCode"
      requestBody:
        required: true
        content:
          audio/webm:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The recognized transcript.
          content:
            application/json:
              schema:
                type: object
                required: [transcript]
                properties:
                  transcript:
                    type: string
              example:
                transcript: "आज मौसम कैसा है?"
        "400":
          description: >
            Missing/unrecognized language code, empty or oversized audio
            body, or no speech was recognized in the recording (e.g.
            silence) — the call succeeded but produced nothing to send.
          content:
            application/json:
              schema:
                $ref: "./chat.yaml#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_request
                  message: "no speech was recognized in that recording"
        "502":
          description: >
            The ASR capability (Phase 3 Milestone 3b's Python module) is
            unreachable or failed.
          content:
            application/json:
              schema:
                $ref: "./chat.yaml#/components/schemas/ErrorResponse"
              example:
                error:
                  code: asr_unavailable
                  message: "speech recognition is temporarily unavailable, please try again or type instead"

  /speech/synthesize:
    post:
      summary: >
        Synthesize a reply's speech. Audio is generated fresh per call and
        never persisted or retained (docs/PROJECT_GOAL.md). A successful
        response is the raw audio bytes, not a JSON envelope — there is
        nothing else the caller needs beyond the audio itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, language]
              properties:
                text:
                  type: string
                language:
                  $ref: "./chat.yaml#/components/schemas/LanguageCode"
              example:
                text: "आज मौसम अच्छा है।"
                language: hi
      responses:
        "200":
          description: The synthesized audio.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "400":
          description: >
            Missing/unrecognized language code, malformed JSON body, or
            empty/whitespace-only text.
          content:
            application/json:
              schema:
                $ref: "./chat.yaml#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_request
                  message: "text must not be empty"
        "502":
          description: >
            The TTS capability (Phase 4 Milestone 4b's Python module) is
            unreachable or failed.
          content:
            application/json:
              schema:
                $ref: "./chat.yaml#/components/schemas/ErrorResponse"
              example:
                error:
                  code: tts_unavailable
                  message: "speech synthesis is temporarily unavailable, please try again"
